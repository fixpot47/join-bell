plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    fixlibApi {
        java.srcDir 'src/fixlibApi/java'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile-only API bridge for FixLib while its 26.3 artifact is not yet
    // available from a public Maven repository. The class is NOT packaged
    // into JoinBell; at runtime the real class is provided by required FixLib.
    compileOnly sourceSets.fixlibApi.output
}

tasks.named('compileJava') {
    dependsOn tasks.named('compileFixlibApiJava')
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
